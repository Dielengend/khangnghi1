[build]
  command = "rm -rf node_modules .next && npm install && NEXT_DISABLE_TURBOPACK=1 npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_DISABLE_TURBOPACK = "1"
  CI = "true"

[build.cache]
  disable = true

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "production" }
